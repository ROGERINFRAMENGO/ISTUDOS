<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma de estudos para a estudante da Etec" />
    <title>Estudo Etec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">E</div>
          <div>
            <p class="eyebrow">Preparação</p>
            <h1>Estudo Etec</h1>
          </div>
        </div>

        <nav class="nav" id="mainNav"></nav>

        <div class="mini-card">
          <p class="eyebrow">XP total</p>
          <h3 id="xpValue">0 XP</h3>
          <div class="progress-line"><span id="xpProgress"></span></div>
          <small id="xpMeta">Nível 1 · 0/1000 XP</small>
        </div>
      </aside>

      <main class="main-panel" id="mainPanel"></main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
